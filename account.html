<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Words2Voice</h1>
        <ul>

            <li><a href="/bank">Bank</a></li>
            <li><a href="/myAccount">My Account</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </header>
    <main>


        <section class="account-intro">
            <h2>My Account</h2>
            <p>Manage your caregiver and child information.</p>
        </section>

        <section class="my-profile">

            <h2>My Profile</h2>

            <form id="profile-form">

                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="firstName" placeholder="Enter your first name" required>

                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="lastName" placeholder="Enter your last name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <h3>Child Information</h3>

                <label for="child-name">Child's First Name</label>
                <input type="text" id="child-name" name="childName" placeholder="Enter child's first name">

                <label for="birthdate">Child's Birthdate</label>
                <input type="date" id="birthdate" name="birthdate">

                <label for="communication">How does your child communicate?</label>
                <select id="communication" name="communication">
                    <option value="">Select an option</option>
                    <option value="verbal">Verbal</option>
                    <option value="nonverbal">Nonverbal</option>
                    <option value="emerging">Emerging Speech</option>
                    <option value="other">Other / Multiple Ways</option>
                </select>

                <button type="submit">Save Profile</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Words2Voice | Little Voices, Big Connections.</p>
        <p>&copy; 2026 Words2Voice. All rights reserved.</p>
    </footer>
</body>

</html>
