
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words2Voice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Words2Voice</h1>

    <img src="/Joyful%20Communication%20Through%20AAC%20Play.png"
         alt="Words2Voice communication illustration">

    <span>Create little words, build a big voice</span>

    <p>Helping little ones communicate through pictures, words, and phrases.</p>

    <section class="loginForm">

        <form action="/login" method="POST">

            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <button type="submit">Sign In</button>

        </form>

        <span>Create Account <a href="/signup">Sign Up</a></span>

    </section>

    <footer>
        <p>Words2Voice | Little Voices, Big Connections.</p>
        <p>&copy; 2026 Words2Voice. All rights reserved.</p>
    </footer>

</body>
</html>
